ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3

    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ------------------------------------------------------------------
    # Source 0: OTOS optical odometry (primary).
    # OTOS publishes absolute pose in odom frame plus velocities.
    # Fuse x, y, yaw, vx, vy, vyaw. Not fusing z/roll/pitch/vz (2D mode
    # zeros them anyway).
    #
    # NOTE: otos_node currently publishes zero covariance. EKF weighting
    # against this source is not meaningful until task #10 populates real
    # covariance. Fusion works; graceful degradation weighting does not.
    # ------------------------------------------------------------------
    odom0: /odom
    odom0_config: [true,  true,  false,    # x, y, z
                   false, false, true,     # roll, pitch, yaw
                   true,  true,  false,    # vx, vy, vz
                   false, false, true,     # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ------------------------------------------------------------------
    # Source 1: LiDAR scan-to-scan matching (fallback pose).
    # laser_scan_matcher publishes cumulative pose in odom frame from
    # sequential scan alignment. Fuse as differential — it has no
    # absolute reference; only its scan-to-scan deltas are meaningful.
    # Provides x, y, yaw when the LiDAR sees walls with enough features.
    # ------------------------------------------------------------------
    odom1: /odometry/laser
    odom1_config: [true,  true,  false,    # x, y, z
                   false, false, true,     # roll, pitch, yaw
                   false, false, false,    # vx, vy, vz
                   false, false, false,    # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom1_differential: true
    odom1_relative: false
    odom1_queue_size: 10

    # ------------------------------------------------------------------
    # Source 2: Madgwick-filtered IMU (fallback heading + yaw rate).
    # imu_filter_madgwick fuses accel + gyro into an orientation quaternion
    # (no magnetometer — LSM9DS1 handler currently doesn't publish mag).
    # Without mag, yaw drifts on the order of 1-3 deg/minute; sufficient
    # as a short-term fallback but not a long-term absolute reference.
    # Fuse yaw (relative) and yaw rate.
    # ------------------------------------------------------------------
    imu0: /imu/data
    imu0_config: [false, false, false,    # x, y, z
                  false, false, true,     # roll, pitch, yaw
                  false, false, false,    # vx, vy, vz
                  false, false, true,     # vroll, vpitch, vyaw
                  false, false, false]    # ax, ay, az
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
