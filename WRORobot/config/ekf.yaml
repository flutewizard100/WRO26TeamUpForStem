ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3

    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ------------------------------------------------------------------
    # Source 0: OTOS optical odometry (primary).
    # OTOS publishes absolute pose in odom frame plus velocities.
    # Fuse x, y, yaw, vx, vy, vyaw. Not fusing z/roll/pitch/vz (2D mode
    # zeros them anyway).
    #
    # otos_node publishes diagonal covariance driven by parameters
    # (pose_xy_std, pose_yaw_std, twist_xy_std, twist_yaw_std). Tune
    # those in the launch file — do NOT scale here.
    # ------------------------------------------------------------------
    odom0: /otos_raw
    odom0_config: [true,  true,  false,    # x, y, z
                   false, false, true,     # roll, pitch, yaw
                   true,  true,  false,    # vx, vy, vz
                   false, false, true,     # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
