ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.3

    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Madgwick-filtered IMU
    # Fuse only angular velocity around Z initially
    imu0: /imu/data
    imu0_config: [false, false, false,    # x, y, z
                  false, false, false,    # roll, pitch, yaw
                  false, false, false,    # vx, vy, vz
                  false, false, true,     # vroll, vpitch, vyaw
                  false, false, false]    # ax, ay, az

    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
