scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.10           # drop < 10 cm — self-hits
        upper_threshold: 4.0            # drop > 4 m — max-range phantoms
        lower_replacement_value: .inf   # replace with inf so median_in_arc ignores it
        upper_replacement_value: .inf

    filter2:
      name: speckle
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0                  # 0 = radial, 1 = distance
        max_range: 4.0
        max_range_difference: 0.5       # drop points > 0.5 m off from neighbors
        filter_window: 2                # 2-point window


