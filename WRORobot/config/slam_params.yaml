slam_toolbox:
  ros__parameters:
    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_linear_search_factor: 0.5

    minimum_travel_distance: 0.1     # 10 cm — was 0.5 by default
    minimum_travel_heading: 0.15     # ~9 deg — was 0.5 rad
    map_update_interval: 1.0         # 1 s — was 5.0 s
    resolution: 0.05                 # 5 cm cells (fine for WRO)
    max_laser_range: 3.0             # match LD19 range_max


    qos_overrides:
      /scan:
        subscription:
          reliability: best_effort
