# Sim-time Nav2 parameters — identical to nav2_params.yaml except:
#   - use_sim_time: true everywhere
#   - inflation_radius reduced to 0.07 (per plan; sim has cleaner obstacle data)
#
# Keep this in sync with nav2_params.yaml when you change controller/planner
# tuning. TODO(measure): once the real chassis dims are locked in, refresh
# footprint and min_turning_r in BOTH files.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    # Auto-seed AMCL at startup so the map->odom transform exists before
    # Nav2's costmaps try to activate. Without this, global_costmap's
    # activation times out waiting for the `map` frame and the whole
    # navigation lifecycle group aborts.
    # Values match the sim spawn pose (see wro_sim/launch/sim.launch.py:
    #   x=0, y=-1.3, yaw=1.5708). Update both together if you move the spawn.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: -1.3
      z: 0.0
      yaw: 1.5708

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Point at our Ackermann-safe BT (no Spin — the WRO robot can't rotate
    # in place). Absolute path because $(find-pkg-share ...) substitution
    # doesn't reliably resolve here in Jazzy. Without this, bt_navigator
    # falls back to Nav2's default BT and errors on "Action server spin not
    # available".
    default_nav_to_pose_bt_xml: "/home/dorina/Code/WRO26TeamUpForStem/install/wro_nav2/share/wro_nav2/bt/wro_navigate_to_pose.xml"
    default_nav_through_poses_bt_xml: "/home/dorina/Code/WRO26TeamUpForStem/install/wro_nav2/share/wro_nav2/bt/wro_navigate_through_poses.xml"
    # plugin_lib_names removed: Nav2 Jazzy's bt_navigator auto-registers the
    # standard BT nodes internally. Listing them here (as older Nav2 versions
    # required) causes double registration and a fatal
    #   "ID [ComputePathToPose] already registered"
    # crash. If you need a *custom* BT plugin, add it here as a single-entry
    # list — don't re-add the built-ins.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.30
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      footprint: "[[0.14, 0.08], [0.14, -0.08], [-0.14, -0.08], [-0.14, 0.08]]"
      plugins: ["obstacle_layer", "pillar_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      # Same pillar source as global_costmap, but with much shorter
      # persistence so stale detections clear while the robot is moving —
      # the local costmap is a rolling window, not a memory.
      pillar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pillars
        pillars:
          topic: /perception/pillar_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          max_obstacle_height: 0.5
          observation_persistence: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.07
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.02
      footprint: "[[0.14, 0.08], [0.14, -0.08], [-0.14, -0.08], [-0.14, 0.08]]"
      track_unknown_space: true
      plugins: ["static_layer", "pillar_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # Pillars detected by wro_behavior/pillar_detector. observation_persistence
      # keeps a pillar in the costmap for 30 s even after the camera loses
      # sight of it — WRO pillars don't move, so we shouldn't unmark them
      # every time the robot turns away.
      pillar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pillars
        pillars:
          topic: /perception/pillar_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 0.5
          observation_persistence: 30.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.07
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    # Absolute path so map_server resolves independent of CWD. nav2_bringup's
    # RewrittenYaml doesn't reliably substitute this in Jazzy when called via
    # our nested launch; pinning the install-share path avoids the issue.
    yaml_filename: "/home/dorina/Code/WRO26TeamUpForStem/install/wro_nav2/share/wro_nav2/maps/wro_field.yaml"

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.30
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "backup", "assisted_teleop"]
    wait:
      plugin: "nav2_behaviors::Wait"
    backup:
      plugin: "nav2_behaviors::BackUp"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.9]
    min_velocity: [-0.35, 0.0, -1.9]
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# collision_monitor: nav2_bringup unconditionally launches this in Jazzy.
# Empty observation_sources is treated as "unset" and aborts the whole
# navigation lifecycle group, so we declare one scan source. Polygons is
# still empty — the node runs but takes no action; add real polygons here
# when tuning bumper/slowdown zones.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Empty `polygons` is also rejected in Jazzy. Declare one no-op polygon
    # (action_type: none) so the node configures cleanly. Replace with a real
    # bumper/slowdown zone when tuning.
    polygons: ["FootprintNoop"]
    FootprintNoop:
      type: "polygon"
      points: "[[0.20, 0.10], [0.20, -0.10], [-0.20, -0.10], [-0.20, 0.10]]"
      action_type: "none"
      min_points: 4
      visualize: false
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true

# docking_server: nav2_bringup unconditionally launches this in Jazzy and
# refuses to configure without at least one dock plugin declared. The WRO
# robot doesn't dock, so this is a stub — provide one plugin so it configures
# clean; we never actually call the docking action.
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
